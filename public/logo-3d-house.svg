  <!-- Wall left (salmon) -->
  <polygon points="-65.3,-51.9 -63.2,-3.9 -22.5,33.9 -23.3,-16.1"
    fill="#E07A5F" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Wall front (teal) -->
  <polygon points="-22.5,32.8 64,2.8 66.2,-45.6 -23.3,-17.3"
    fill="#2A9D8F" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Roof front (purple) — closest to camera -->
  <polygon points="-23.7,-17.4 65.8,-45.7 42.8,-100.1 -47.1,-75"
    fill="#9B5DE5" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
