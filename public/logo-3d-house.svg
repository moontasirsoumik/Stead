<svg xmlns="http://www.w3.org/2000/svg" viewBox="-78 -112 156 158" width="300">
  <!-- Stead Logo — 3D House (isometric origami house) -->
  <!-- Viewing angle: rotateX(58°) rotateZ(-32°), perspective 900px -->

  <!-- Roof back (gold) — partially visible behind roof front -->
  <polygon points="-46,-73.2 43.9,-98.4 20.3,-77 -65.6,-52.2"
    fill="#E9C46A" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Tri-left (beige gable triangle) -->
  <polygon points="-65.3,-51.9 -46.2,-73.3 -23.3,-16.1"
