<svg xmlns="http://www.w3.org/2000/svg" viewBox="-77 -46 155 93" width="300">
  <!-- Stead Logo — Folded Diamond (3D isometric view) -->
  <!-- All pieces folded flat onto floor, viewed at rotateX(58°) rotateZ(-32°) -->

  <!-- Floor -->
  <polygon points="-63.2,-4.2 20.1,-30.5 64,3.7 -22.5,33.6"
    fill="#DDD5C8" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Roof front (folded onto floor from bottom) -->
  <polygon points="-51,6.7 33.2,-20.7 65.8,4.6 -20.9,34.7"
    fill="#9B5DE5" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Front wall (folded onto floor from bottom) -->
  <polygon points="-23,32.3 63.5,2.4 32.7,-21.5 -51.5,5.8"
    fill="#2A9D8F" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Roof back (folded onto floor from top) -->
  <polygon points="-64.6,-6.8 18.5,-33 49.7,-8.7 -35.8,20"
    fill="#E9C46A" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Back wall (folded onto floor from top) -->
  <polygon points="-36.3,19.1 49.2,-9.6 19.6,-32.6 -63.7,-6.3"
    fill="#264653" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Left wall (folded onto floor from left) -->
  <polygon points="-17.2,-21.2 -64.1,-6.4 -23.4,31.3 25.4,14.5"
    fill="#E07A5F" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Tri-left (folded back onto left wall) -->
  <polygon points="-16.4,-21.9 -31.2,7 26.3,13.7"
    fill="#F2CC8F" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Right wall (folded onto floor from right) -->
  <polygon points="19.3,-33.6 -25.6,-19.4 16.7,16.6 63.4,0.5"
    fill="#3D85C6" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Tri-right (folded back onto right wall) -->
  <polygon points="-24.8,-20.1 30.1,-14 17.6,15.9"
    fill="#81B29A" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
</svg>
