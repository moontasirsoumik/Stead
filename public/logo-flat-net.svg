<svg xmlns="http://www.w3.org/2000/svg" viewBox="-146 -85 295 194" width="400">
  <!-- Stead Logo — Flat Paper Net (unfolded cross pattern, isometric view) -->
  <!-- All 9 origami house pieces laid flat, viewed at rotateX(58°) rotateZ(-32°) -->

  <!-- Floor (center) -->
  <polygon points="-63.2,-4.2 20.1,-30.5 64,3.7 -22.5,33.6"
    fill="#DDD5C8" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Roof back (above back wall) -->
  <polygon points="-112.5,-50.1 -33.7,-72.4 -7.2,-51.8 -88.2,-27.5"
    fill="#E9C46A" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Back wall (above floor) -->
  <polygon points="-88.2,-27.5 -7.2,-51.8 20.1,-30.5 -63.2,-4.2"
    fill="#264653" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Front wall (below floor) -->
  <polygon points="-22.5,33.6 64,3.7 97.7,29.9 8.8,62.8"
    fill="#2A9D8F" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Roof front (below front wall) -->
  <polygon points="8.8,62.8 97.7,29.9 136.8,60.3 45.4,96.7"
    fill="#9B5DE5" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Left wall (left of floor) -->
  <polygon points="-112.5,11.5 -63.2,-4.2 -22.5,33.6 -74.1,51.5"
    fill="#E07A5F" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Tri-left (left of left wall) -->
  <polygon points="-112.5,11.5 -133.6,43.9 -74.1,51.5"
    fill="#F2CC8F" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Right wall (right of floor) -->
  <polygon points="20.1,-30.5 62.6,-44 108,-11.5 64,3.7"
    fill="#3D85C6" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Tri-right (right of right wall) -->
  <polygon points="62.6,-44 115.4,-38.5 108,-11.5"
    fill="#81B29A" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
</svg>
